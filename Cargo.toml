[package]
name = "image-processing-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
image = "0.25.9"
# egui is reached through `eframe::egui` so the two can never drift apart in version.
eframe = "0.35"
rfd = "0.17"
pixo = "0.4"

# Optimize dependencies even in debug builds. The per-pixel filter loops run through
# `image`, and a full-resolution pass takes ~13s unoptimized vs ~0.4s optimized.
[profile.dev.package."*"]
opt-level = 3
